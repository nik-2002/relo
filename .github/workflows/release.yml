name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # The project needs Swift 6.2 (Xcode 26 or later); use the newest stable Xcode on the runner.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild -scheme Relo -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="${VERSION}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
